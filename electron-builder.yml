appId: com.viva.app
productName: VIVA
copyright: Copyright © 2024-2025 Sean Lee

publish:
  provider: github
  releaseType: release

directories:
  output: dist

files:
  - out/**/*
  - '!**/*.tsbuildinfo'
  - node_modules/**/*
  - package.json

extraResources:
  - from: assets/brand/viva-window-icon.png
    to: brand/viva-window-icon.png

# Windows — NSIS installer
win:
  icon: assets/brand/viva-icon.ico
  artifactName: VIVA-${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS — separate native installers for Apple Silicon and Intel
mac:
  icon: assets/brand/viva-icon.icns
  artifactName: VIVA-${version}-mac-${arch}.${ext}
  minimumSystemVersion: '13.0'
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools

dmg:
  title: VIVA

# Linux — AppImage
linux:
  icon: assets/brand/viva-icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Development
