<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">VIVA</title>
  <desc id="description">A white V connects three version-history nodes on a blue rounded square.</desc>
  <defs>
    <linearGradient id="blue" x1="190" y1="110" x2="850" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.56" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="edge" x1="220" y1="96" x2="780" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#102A68" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#blue)" filter="url(#shadow)"/>
  <rect x="98" y="98" width="828" height="828" rx="188" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <path d="M312 330 512 700 712 330" fill="none" stroke="#FFFFFF" stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="312" cy="330" r="66" fill="#FFFFFF"/>
  <circle cx="712" cy="330" r="66" fill="#FFFFFF"/>
  <circle cx="512" cy="700" r="66" fill="#FFFFFF"/>
  <circle cx="312" cy="330" r="25" fill="#3578EE"/>
  <circle cx="712" cy="330" r="25" fill="#2C6BE8"/>
  <circle cx="512" cy="700" r="25" fill="#67E8F9"/>
</svg>
