name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'electron-builder.yml'
      - 'package*.json'
      - 'scripts/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - id: release
        run: node scripts/release/metadata.mjs

  build:
    name: Installer — ${{ matrix.target }}
    needs: metadata
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
            arch: --arm64
            artifact: dist/VIVA-*-mac-arm64.dmg
          - os: macos-15-intel
            target: mac-x64
            arch: --x64
            artifact: dist/VIVA-*-mac-x64.dmg
          - os: windows-latest
            target: windows-x64
            artifact: dist/VIVA-*-windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit all dependencies
        run: npm run audit
      - name: Typecheck and test
        run: npm run typecheck && npm test
      - name: Verify release scripts
        run: node --test scripts/release/*.test.mjs
      - name: Build app
        run: npm run build
      - name: Package macOS team preview
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg ${{ matrix.arch }} --publish never --config.mac.identity=- --config.mac.timestamp=none
        env:
          # Verify the same ad-hoc signing on PRs and tags, without signing credentials.
          CSC_FOR_PULL_REQUEST: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Windows team preview
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never --config.win.signExecutable=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install and run the actual packaged app
        run: node scripts/release/smoke-installed.mjs dist
      - name: Keep verified installer
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Keep startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: startup-diagnostics-${{ matrix.target }}
          path: dist/release-smoke/**
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify, upload, then publish
        run: node scripts/release/publish.mjs release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
